services:
  onboarding-web-dev:
    container_name: onboarding-web-dev
    build:
      context: .
      target: production
      args:
        VITE_API_BASE_URL: ${DEV_VITE_API_BASE_URL:-https://dev-api.seu-dominio.com}
    ports:
      - "${DEV_FRONTEND_PORT:-4173}:80"
    restart: unless-stopped
