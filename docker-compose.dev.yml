services:
  onboarding-web-dev:
    container_name: onboarding-web-dev
    build:
      context: .
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    env_file:
      - ./docker/env/dev.env
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    restart: unless-stopped
