services:
  onboarding-web-local:
    container_name: onboarding-web-local
    build:
      context: .
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${LOCAL_FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
